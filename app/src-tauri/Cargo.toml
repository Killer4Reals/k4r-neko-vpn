[package]
name = "k4r-neko-vpn"
version = "0.1.0"
description = "K4R Neko VPN"
authors = ["K4R"]
edition = "2021"

[lib]
name = "k4r_neko_vpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
base64 = "0.22"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
