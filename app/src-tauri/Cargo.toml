[package]
name = "k4r-neko-vpn"
version = "1.54.0"
description = "K4R Neko VPN"
authors = ["K4R"]
edition = "2021"

[lib]
name = "k4r_neko_vpn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
# WFP kill-switch: Mullvad'овская обёртка (MIT/Apache-2.0), dynamic-сессии из коробки
wfp = "0.3"
# Mica/Acrylic на Win11: окно перестаёт быть плоским прямоугольником
window-vibrancy = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Clash/Mihomo отдают список серверов в YAML — половина провайдеров
# работает только так.
serde_yaml_ng = "0.10"
ureq = "3"
base64 = "0.22"
url = "2"
winreg = "0.55"
percent-encoding = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
# X2: диагностика одним архивом для поддержки
zip = { version = "8", default-features = false, features = ["deflate"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
getrandom = "0.2"
# Сверка контрольной суммы скачанного установщика до запуска.
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
