<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K4R Neko VPN</title>
  </head>
  <body>
    <!-- Тема одна — «Неон»; ставим её до первой отрисовки, чтобы не было
         вспышки чужой палитры. Старые сохранённые значения больше не читаем. -->
    <script>
      (function () {
        try {
          localStorage.removeItem("k4r.theme");
        } catch (e) {}
        document.documentElement.dataset.theme = "mascot";
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
