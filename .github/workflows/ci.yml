name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: ядро (Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      # tauri-build ждёт собранный фронтенд (frontendDist), а он в .gitignore:
      # без этого шага сборка ядра падает на своём build-скрипте
      - name: фронтенд
        working-directory: app
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test

  ui:
    name: интерфейс (React)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci
        working-directory: app
        run: npm ci
      - name: типы
        working-directory: app
        run: npx tsc --noEmit
      - name: тесты
        working-directory: app
        run: npm test
